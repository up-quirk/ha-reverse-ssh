name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_metadata.py
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: reverse_ssh
          platforms: linux/${{ matrix.arch == 'aarch64' && 'arm64' || 'amd64' }}
          build-args: BUILD_ARCH=${{ matrix.arch }}
          push: false
          load: true
          tags: ha-reverse-ssh:dev
      - if: matrix.arch == 'amd64'
        run: docker build -t ha-reverse-ssh-fixture:dev tests/integration
      - if: matrix.arch == 'amd64'
        run: python3 tools/integration_test.py

configuration:
  ssh_host:
    name: SSH host
    description: >-
      Reachable server IP or DNS name (not a URL). Setup: after its first start,
      the app waits for two files in app_configs/<repository-id>_reverse_ssh/.
      id_ed25519 contains your private SSH login key without a passphrase;
      known_hosts contains the verified public host key of the server.
      Do not paste keys into this form. Instructions and file examples:
      https://github.com/up-quirk/ha-reverse-ssh/blob/main/reverse_ssh/DOCS.md#6-fill-the-two-files
  ssh_port:
    name: SSH port
  ssh_user:
    name: SSH user
  remote_bind_address:
    name: Bind address on server
    description: >-
      Requested listener address on the SSH server. Use 127.0.0.1 for a local
      proxy or VPN forwarding to loopback; use the VPN IP for direct VPN access.
      The server GatewayPorts setting can override this choice. See setup guide.
  remote_port:
    name: Port on server
  target_host:
    name: Destination host
    description: homeassistant reaches HA Core; localhost means this app container.
  target_port:
    name: Destination port
  use_autossh:
    name: Use autossh
    description: Both modes reconnect; autossh also supervises its SSH child.

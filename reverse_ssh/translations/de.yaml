configuration:
  ssh_host:
    name: SSH-Host
    description: >-
      Erreichbare Server-IP oder DNS-Name, keine URL. Einrichtung: Nach dem ersten
      Start wartet die App auf zwei Dateien in app_configs/<Repository-ID>_reverse_ssh/.
      id_ed25519 enthält den privaten SSH-Anmeldeschlüssel ohne Passphrase;
      known_hosts enthält den geprüften öffentlichen Hostschlüssel des Servers.
      Keine Schlüssel in dieses Formular eintragen. Anleitung mit Dateibeispielen:
      https://github.com/up-quirk/ha-reverse-ssh/blob/main/reverse_ssh/DOCS.de.md#6-die-beiden-dateien-befüllen
  ssh_port:
    name: SSH-Port
  ssh_user:
    name: SSH-Benutzer
  remote_bind_address:
    name: Bind-Adresse auf dem Server
    description: >-
      Gewünschte Listener-Adresse auf dem SSH-Server. 127.0.0.1 für lokalen
      Proxy oder VPN-Weiterleitung auf Loopback; VPN-IP für direkten VPN-Zugriff.
      GatewayPorts auf dem Server kann diese Auswahl überschreiben. Siehe Anleitung.
  remote_port:
    name: Port auf dem Server
  target_host:
    name: Zielhost
    description: homeassistant erreicht HA Core; localhost bezeichnet die App selbst.
  target_port:
    name: Zielport
  use_autossh:
    name: autossh verwenden
    description: Beide Modi verbinden neu; autossh überwacht zusätzlich den SSH-Prozess.
